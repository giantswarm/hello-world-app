suite: pod scheduling and the architecture value
templates:
  - deployment.yaml
tests:
  - it: renders no scheduling fields by default
    # Guards backwards compatibility: an unset architecture must not add a
    # nodeSelector or tolerations, so bumping the chart causes no pod churn.
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations

  - it: pins to arm64 with both the node selector and the taint toleration
    # The arm64 pool is tainted, so the selector alone would leave the pod
    # Pending and the toleration alone would let it land on any pool.
    set:
      architecture: arm64
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: arm64
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: kubernetes.io/arch
            operator: Equal
            value: arm64
            effect: NoSchedule
      - lengthEqual:
          path: spec.template.spec.tolerations
          count: 1

  - it: pins to amd64 with the selector only, as amd64 pools carry no taint
    set:
      architecture: amd64
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: amd64
      - notExists:
          path: spec.template.spec.tolerations

  - it: merges architecture with explicit nodeSelector and tolerations
    set:
      architecture: arm64
      nodeSelector:
        disktype: ssd
      tolerations:
        - key: dedicated
          operator: Exists
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: arm64
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
      - lengthEqual:
          path: spec.template.spec.tolerations
          count: 2
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Exists
            effect: NoSchedule

  - it: lets architecture win over a conflicting kubernetes.io/arch selector
    # The two must agree, since architecture also decides the toleration.
    set:
      architecture: arm64
      nodeSelector:
        kubernetes.io/arch: amd64
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: arm64

  - it: renders nodeSelector without architecture
    set:
      nodeSelector:
        disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
      - notExists:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
      - notExists:
          path: spec.template.spec.tolerations
